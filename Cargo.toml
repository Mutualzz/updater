[package]
name = "updater"
version = "2.2.5"
edition = "2021"

[[bin]]
name = "updater"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
zip = "2"
tar = "0.4"
flate2 = "1"
log = "0.4"
env_logger = "0.11.10"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
anyhow = "1"
base64 = "0.22"

eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[build-dependencies]
winres = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true