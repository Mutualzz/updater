<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        html, body {
            width: 300px;
            height: 340px;
            overflow: hidden;
            background: transparent;
            border-radius: 16px;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
            -webkit-app-region: drag;
        }

        .window {
            width: 300px;
            height: 340px;
            background: #241927;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 0 1px rgba(255, 247, 251, 0.08),
            0 32px 64px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.15s ease forwards;
            -webkit-app-region: drag;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .logo-wrap {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            flex-shrink: 0;
            -webkit-app-region: drag;
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .logo-wrap img.loaded {
            opacity: 1;
        }

        .app-name {
            color: #FFF7FB;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .status {
            color: #FFF7FB;
            opacity: 0.45;
            font-size: 12px;
            font-weight: 400;
            margin-bottom: 28px;
            min-height: 18px;
            text-align: center;
            padding: 0 16px;
            transition: opacity 0.15s;
        }

        .progress-track {
            width: 200px;
            height: 4px;
            background: rgba(108, 90, 109, 0.35);
            border-radius: 999px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .progress-track.visible {
            opacity: 1;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #00D1C1;
            border-radius: 999px;
            transition: width 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 209, 193, 0.55);
        }

        .bottom {
            position: absolute;
            bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #6c5a6d;
            animation: pulse 1.4s ease-in-out infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.25; transform: scale(1); }
            40% { opacity: 1; transform: scale(1.3); }
        }

        .dot-wrap.hidden { display: none; }
    </style>
</head>
<body>
<div class="window">
    <div class="logo-wrap">
        <img id="logo" src="__LOGO_DATA_URL__" alt="Mutualzz"
             onload="this.classList.add('loaded')" />
    </div>

    <div class="app-name">Mutualzz</div>
    <div class="status" id="status">Checking for updates...</div>

    <div class="progress-track" id="track">
        <div class="progress-fill" id="fill"></div>
    </div>

    <div class="bottom">
        <div class="dot-wrap" id="dots">
            <div style="display:flex;gap:6px">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>
</div>

<script>
    window.setStatus = function(text) {
        document.getElementById('status').textContent = text;
    };

    window.setProgress = function(percent) {
        var track = document.getElementById('track');
        var fill  = document.getElementById('fill');
        var dots  = document.getElementById('dots');
        track.classList.add('visible');
        fill.style.width = Math.min(100, percent) + '%';
        dots.classList.add('hidden');
    };

    window.hideProgress = function() {
        var track = document.getElementById('track');
        var dots  = document.getElementById('dots');
        track.classList.remove('visible');
        document.getElementById('fill').style.width = '0%';
        dots.classList.remove('hidden');
    };
</script>
</body>
</html>
